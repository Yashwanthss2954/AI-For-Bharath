services:
  # Backend API Service
  - type: web
    name: ubid-backend-api
    runtime: python
    plan: free
    buildCommand: |
      cd backend
      pip install -r requirements.txt
      python -m src.main
    startCommand: cd backend && uvicorn src.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health

  # Frontend Static Site
  - type: web
    name: ubid-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
